<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows 11 Portfolio</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/mica.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/lockscreen.css" />
  <link rel="stylesheet" href="css/desktop.css" />
  <link rel="stylesheet" href="css/taskbar.css" />
</head>
<body>

  <!-- Lock Screen -->
  <div id="lockScreen">
    <div id="lockScreen-content">
      <div id="lockClock"></div>
      <div id="lockDate"></div>
    </div>
    <div id="lockHint">Click anywhere or press any key to unlock</div>
  </div>

  <!-- Login Screen -->
  <div id="loginScreen">
    <div id="loginCard">
      <div id="loginAvatar">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <div id="loginUsername">Alex</div>
      <form id="loginForm" autocomplete="off">
        <div id="loginInput-wrap">
          <input type="password" id="loginPassword" placeholder="guest" />
          <button type="button" id="loginSubmit" title="Sign in">
            <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
          </button>
        </div>
      </form>
      <div id="loginGuest">Sign in as Guest</div>
      <div id="loginOptions">
        <span class="login-option-link">Other user</span>
        <span class="login-option-link">Sign-in options</span>
      </div>
    </div>
  </div>

  <!-- Desktop Area -->
  <div id="desktop">
    <div class="desktop-icons-grid"></div>
  </div>

  <!-- Windows Container (for dynamically created windows) -->
  <div id="windows-container"></div>

  <!-- Start Menu -->
  <div id="start-menu">
    <div id="start-search">
      <input type="text" placeholder="Search apps, settings, and documents" />
    </div>
    <div id="start-grid">
      <h3>Pinned</h3>
      <div id="start-apps-grid" class="start-apps-grid"></div>
    </div>
    <div id="start-menu-footer">
      <div id="start-user">
        <div id="start-user-avatar">A</div>
        <span id="start-user-name">Alex</span>
      </div>
      <div id="start-power" title="Power">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A6.92 6.92 0 0119 12c0-3.87-3.13-7-7-7a6.98 6.98 0 00-5.58 2.47l-1.42-1.42A8.96 8.96 0 0112 4c4.97 0 9 4.03 9 9s-4.03 9-9 9a8.96 8.96 0 01-6.83-3.33z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar"></div>

  <!-- Scripts (order matters: state first, then windowManager, then apps, then lockscreen) -->
  <script src="js/state.js"></script>
  <script src="js/windowManager.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/lockscreen.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/taskbar.js"></script>
</body>
</html>
