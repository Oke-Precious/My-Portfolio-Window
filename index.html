<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows 11 Portfolio</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/mica.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/lockscreen.css" />
</head>
<body>

  <!-- Lock Screen -->
  <div id="lockScreen">
    <div id="lockScreen-content">
      <div id="lockClock"></div>
      <div id="lockDate"></div>
    </div>
    <div id="lockHint">Click anywhere or press any key to unlock</div>
  </div>

  <!-- Login Screen -->
  <div id="loginScreen">
    <div id="loginCard">
      <div id="loginAvatar">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <div id="loginUsername">Alex</div>
      <form id="loginForm" autocomplete="off">
        <div id="loginInput-wrap">
          <input type="password" id="loginPassword" placeholder="guest" />
          <button type="button" id="loginSubmit" title="Sign in">
            <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
          </button>
        </div>
      </form>
      <div id="loginGuest">Sign in as Guest</div>
      <div id="loginOptions">
        <span class="login-option-link">Other user</span>
        <span class="login-option-link">Sign-in options</span>
      </div>
    </div>
  </div>

  <!-- Desktop Area -->
  <div id="desktop">
    <div id="desktop-icons"></div>
  </div>

  <!-- Windows Container (for dynamically created windows) -->
  <div id="windows-container"></div>

  <!-- Start Menu -->
  <div id="start-menu">
    <div id="start-search">
      <input type="text" placeholder="Search apps, settings, and documents" />
    </div>
    <div id="start-grid">
      <h3>Pinned</h3>
      <div id="start-apps-grid" class="start-apps-grid"></div>
    </div>
    <div id="start-menu-footer">
      <div id="start-user">
        <div id="start-user-avatar">A</div>
        <span id="start-user-name">Alex</span>
      </div>
      <div id="start-power" title="Power">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A6.92 6.92 0 0119 12c0-3.87-3.13-7-7-7a6.98 6.98 0 00-5.58 2.47l-1.42-1.42A8.96 8.96 0 0112 4c4.97 0 9 4.03 9 9s-4.03 9-9 9a8.96 8.96 0 01-6.83-3.33z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div id="taskbar-inner"></div>
    <div id="taskbar-right">
      <div class="taskbar-widget" id="start-button" title="Start">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 3h8v8H3V3zm0 10h8v8H3v-8zm10-10h8v8h-8V3zm0 10h8v8h-8v-8z"/>
        </svg>
      </div>
      <div class="taskbar-widget" title="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </div>
      <div class="taskbar-widget" title="Task View">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/>
        </svg>
      </div>
      <div class="taskbar-widget" title="Desktop">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/>
        </svg>
      </div>
      <div class="taskbar-divider"></div>
      <div class="taskbar-widget" id="taskbar-widgets" title="Widgets">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8-2h8v8h-8v-8zm2 2v4h4v-4h-4z"/>
        </svg>
      </div>
      <div class="taskbar-widget" title="Weather">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.35 10.04A7.49 7.49 0 0012 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 000 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>
      </div>
      <div class="taskbar-widget" id="taskbar-icons">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 00-6-6l3 3 3-3a4.24 4.24 0 00-6-6l3 3 3-3z"/>
        </svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
        </svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <div class="taskbar-divider"></div>
      <div class="taskbar-widget" id="taskbar-clock" title="Calendar and Clock">
        <div id="taskbar-time"></div>
        <div id="taskbar-date-day"></div>
      </div>
    </div>
  </div>

  <!-- Scripts (order matters: state first, then windowManager, then apps, then lockscreen) -->
  <script src="js/state.js"></script>
  <script src="js/windowManager.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/lockscreen.js"></script>
</body>
</html>
