<!-- Calculator App -->
<style>
.calc-root {
  display: flex;
  flex-direction: column;
  height: 100%;
  font-family: var(--win11-font);
  background: rgba(0, 0, 0, 0.2);
}

.calc-display {
  padding: 20px 20px 12px;
  text-align: right;
  flex-shrink: 0;
}

.calc-expr {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.4);
  height: 18px;
  margin-bottom: 4px;
  min-height: 18px;
  overflow: hidden;
}

.calc-main {
  font-size: clamp(28px, 6vw, 44px);
  font-weight: 200;
  color: rgba(255, 255, 255, 0.95);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-height: 60px;
  line-height: 1.1;
}

.calc-memory {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.25);
  margin-top: 4px;
  text-align: right;
  height: 16px;
}

.calc-body {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(5, 1fr);
  gap: 2px;
  padding: 4px 8px 8px;
}

.calc-btn {
  border: none;
  border-radius: 4px;
  font-size: 18px;
  font-family: var(--win11-font);
  color: rgba(255, 255, 255, 0.85);
  background: rgba(255, 255, 255, 0.07);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 80ms, transform 60ms;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.calc-btn:hover { background: rgba(255, 255, 255, 0.14); }
.calc-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.18); }

.calc-btn.fn { background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.55); font-size: 15px; }
.calc-btn.fn:hover { background: rgba(255, 255, 255, 0.1); }

.calc-btn.op {
  background: rgba(0, 120, 212, 0.35);
  color: #60cdff;
}
.calc-btn.op:hover { background: rgba(0, 120, 212, 0.5); }

.calc-btn.eq {
  background: var(--win11-accent);
  color: #fff;
}
.calc-btn.eq:hover { background: var(--win11-accent-hover); }

.calc-btn.zero { grid-column: 1 / 3; }

.calc-btn.del {
  background: rgba(220, 53, 69, 0.2);
  color: #f1948a;
  font-size: 14px;
}
.calc-btn.del:hover { background: rgba(220, 53, 69, 0.35); }
</style>

<div class="calc-root">
  <div class="calc-display">
    <div class="calc-expr" id="calc-expr"></div>
    <div class="calc-main" id="calc-main">0</div>
    <div class="calc-memory" id="calc-memory"></div>
  </div>
  <div class="calc-body" id="calc-body">
    <button class="calc-btn fn" data-val="AC">AC</button>
    <button class="calc-btn fn" data-val="±">±</button>
    <button class="calc-btn fn" data-val="%">%</button>
    <button class="calc-btn op" data-val="/">÷</button>

    <button class="calc-btn" data-val="7">7</button>
    <button class="calc-btn" data-val="8">8</button>
    <button class="calc-btn" data-val="9">9</button>
    <button class="calc-btn op" data-val="*">×</button>

    <button class="calc-btn" data-val="4">4</button>
    <button class="calc-btn" data-val="5">5</button>
    <button class="calc-btn" data-val="6">6</button>
    <button class="calc-btn op" data-val="-">−</button>

    <button class="calc-btn" data-val="1">1</button>
    <button class="calc-btn" data-val="2">2</button>
    <button class="calc-btn" data-val="3">3</button>
    <button class="calc-btn op" data-val="+">+</button>

    <button class="calc-btn zero" data-val="0">0</button>
    <button class="calc-btn" data-val=".">.</button>
    <button class="calc-btn eq" data-val="=">=</button>
  </div>
</div>

<script src="js/calculator.js"></script>
